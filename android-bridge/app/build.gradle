plugins {
    id "com.android.application"
}

def sharedBotToken = System.getenv("TGWA_DEFAULT_BOT_TOKEN") ?: ""
if (sharedBotToken && !(sharedBotToken ==~ /[0-9]{6,}:[A-Za-z0-9_-]{20,}/)) {
    throw new GradleException("TGWA_DEFAULT_BOT_TOKEN has an invalid format.")
}
def sharedBotKey = "tgwa-maker-shared-bot-v1".getBytes("UTF-8")
def sharedBotBytes = sharedBotToken.getBytes("UTF-8")
byte[] sharedBotMasked = new byte[sharedBotBytes.length]
for (int index = 0; index < sharedBotBytes.length; index++) {
    sharedBotMasked[index] = (byte) (
        sharedBotBytes[index] ^ sharedBotKey[index % sharedBotKey.length]
    )
}
def sharedBotData = sharedBotMasked.encodeBase64().toString()

android {
    namespace "com.tool48.tgwabridge"
    compileSdk 35
    ndkVersion "27.3.13750724"

    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        applicationId "com.tool48.tgwabridge"
        minSdk 24
        targetSdk 35
        versionCode 31
        versionName "2.4.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField(
            "String",
            "CONTENT_PROVIDER_AUTHORITY",
            "\"com.tool48.tgwabridge.stickercontentprovider\""
        )
        buildConfigField(
            "String",
            "DEFAULT_BOT_TOKEN_DATA",
            "\"${sharedBotData}\""
        )
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "com.airbnb.android:lottie:6.7.1"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    testImplementation "junit:junit:4.13.2"
}
